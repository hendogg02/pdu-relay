<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDU Relay</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f2330;
    --border: #2a2f3d;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #4c8dff;
    --green: #2fb96b;
    --red: #e0523f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  .center-screen {
    min-height: 80vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 28px; width: 340px;
  }
  .card h2 { margin-top: 0; font-size: 17px; }
  .card p.hint { color: var(--muted); font-size: 13px; margin-top: -8px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 9px 10px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
  }
  input[type=checkbox] { margin-right: 6px; }
  .pw-row { display: flex; gap: 8px; align-items: center; }
  .pw-row input { flex: 1; }
  .pw-toggle {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
    padding: 9px 12px; font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  button {
    cursor: pointer; border: none; border-radius: 6px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: white; background: var(--accent);
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--red); }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tabs button {
    background: transparent; color: var(--muted); border-radius: 0;
    padding: 10px 4px; margin-right: 20px; font-weight: 500;
    border-bottom: 2px solid transparent;
  }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  section { display: none; }
  section.active { display: block; }
  .field-group { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; }
  .field-group h3 { margin-top: 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .pdu-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .pdu-card h3 { margin: 0 0 12px; font-size: 15px; }
  .outlet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .outlet-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .outlet-card.on { border-color: var(--green); }
  .outlet-card.off { border-color: var(--red); }
  .outlet-name { font-size: 13px; font-weight: 600; }
  .outlet-power { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .outlet-card.on .outlet-power { color: #7fe3ab; }
  .outlet-actions { display: flex; gap: 6px; }
  .outlet-actions button {
    flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 600;
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
  }
  .outlet-actions button.current-on { background: rgba(47,185,107,0.18); border-color: var(--green); color: #7fe3ab; }
  .outlet-actions button.current-off { background: rgba(224,82,63,0.14); border-color: var(--red); color: #f0a599; }
  .muted { color: var(--muted); }
  .status-msg { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .top-actions { display: flex; justify-content: flex-end; gap: 10px; }
</style>
</head>
<body>

<div id="gate" class="center-screen"></div>

<div id="app" style="display:none;">
  <header>
    <div>
      <h1>PDU Relay</h1>
      <div class="sub">Web management for the PDU Ctrl.grid DashBoard panel</div>
    </div>
    <div class="top-actions">
      <span class="sub" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Log out</button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="pdus" class="active">PDUs</button>
      <button data-tab="settings">Connection Settings</button>
      <button data-tab="account">Admin Account</button>
    </div>

    <section id="tab-pdus" class="active">
      <div class="status-msg" id="pduStatus"></div>
      <div id="pduList"></div>
    </section>

    <section id="tab-settings">
      <div class="field-group">
        <h3>UniFi Controller</h3>
        <label>UDM Host / IP</label>
        <input type="text" id="cfgHost" placeholder="192.168.1.1">
        <label>Site name</label>
        <input type="text" id="cfgSite" placeholder="default">
        <label>Local admin username</label>
        <input type="text" id="cfgUser" placeholder="a local UniFi account, not cloud SSO">
        <label>Local admin password</label>
        <div class="pw-row">
          <input type="password" id="cfgPass" placeholder="leave blank to keep current password">
          <button type="button" class="pw-toggle" data-target="cfgPass">Show</button>
        </div>
        <label><input type="checkbox" id="cfgSelfSigned"> Allow self-signed certificate</label>
        <label>PDU model code</label>
        <input type="text" id="cfgModel" placeholder="USPPDUP">
        <div class="row">
          <button id="saveConfigBtn">Save</button>
          <span class="error" id="configError"></span>
        </div>
      </div>
    </section>

    <section id="tab-account">
      <div class="field-group">
        <h3>Change Admin Login</h3>
        <label>Current password</label>
        <div class="pw-row">
          <input type="password" id="curPass">
          <button type="button" class="pw-toggle" data-target="curPass">Show</button>
        </div>
        <label>New username</label>
        <input type="text" id="newUser">
        <label>New password (8+ characters)</label>
        <div class="pw-row">
          <input type="password" id="newPass">
          <button type="button" class="pw-toggle" data-target="newPass">Show</button>
        </div>
        <div class="row">
          <button id="changeAccountBtn">Update</button>
          <span class="error" id="accountError"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);

const AUTH_ENDPOINTS = ["/api/login", "/api/setup", "/api/session"];

async function api(path, options) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (res.status === 401 && !AUTH_ENDPOINTS.includes(path)) {
    // The session died (most often: the relay restarted, which clears its
    // in-memory sessions) - go back to the login screen instead of leaving
    // a stale "Not authenticated" error sitting next to whatever button was
    // clicked, which looked like the action itself had failed.
    clearInterval(pduPollTimer);
    boot();
    throw new Error("Your session expired - please log in again.");
  }
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  return body;
}

function renderGateCard(html) {
  $("gate").innerHTML = '<div class="card">' + html + '</div>';
  wirePasswordToggles($("gate"));
}

function wirePasswordToggles(root) {
  root.querySelectorAll(".pw-toggle").forEach((btn) => {
    btn.onclick = () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "Show" : "Hide";
    };
  });
}

function showSetupForm() {
  renderGateCard(`
    <h2>Create the admin account</h2>
    <p class="hint">This is the login for this web page, separate from your UniFi credentials.</p>
    <label>Username</label>
    <input type="text" id="setupUser">
    <label>Password (8+ characters)</label>
    <div class="pw-row">
      <input type="password" id="setupPass">
      <button type="button" class="pw-toggle" data-target="setupPass">Show</button>
    </div>
    <div class="row"><button id="setupBtn" style="width:100%">Create account</button></div>
    <div class="error" id="setupError"></div>
  `);
  $("setupBtn").onclick = async () => {
    try {
      await api("/api/setup", { method: "POST", body: JSON.stringify({
        username: $("setupUser").value.trim(), password: $("setupPass").value,
      })});
      boot();
    } catch (err) { $("setupError").textContent = err.message; }
  };
}

function showLoginForm() {
  renderGateCard(`
    <h2>Log in</h2>
    <label>Username</label>
    <input type="text" id="loginUser">
    <label>Password</label>
    <div class="pw-row">
      <input type="password" id="loginPass">
      <button type="button" class="pw-toggle" data-target="loginPass">Show</button>
    </div>
    <div class="row"><button id="loginBtn" style="width:100%">Log in</button></div>
    <div class="error" id="loginError"></div>
  `);
  $("loginBtn").onclick = async () => {
    try {
      await api("/api/login", { method: "POST", body: JSON.stringify({
        username: $("loginUser").value.trim(), password: $("loginPass").value,
      })});
      boot();
    } catch (err) { $("loginError").textContent = err.message; }
  };
}

let pduPollTimer = null;

function showApp(username) {
  $("gate").style.display = "none";
  $("app").style.display = "block";
  $("whoami").textContent = username;
  loadConfigIntoForm();
  refreshPdus();
  clearInterval(pduPollTimer);
  pduPollTimer = setInterval(refreshPdus, 10000);
}

document.querySelectorAll(".tabs button").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll("section").forEach((s) => s.classList.remove("active"));
    btn.classList.add("active");
    $("tab-" + btn.dataset.tab).classList.add("active");
  };
});

$("logoutBtn").onclick = async () => {
  await api("/api/logout", { method: "POST" });
  clearInterval(pduPollTimer);
  boot();
};

async function loadConfigIntoForm() {
  const cfg = await api("/api/config");
  $("cfgHost").value = cfg.udmHost || "";
  $("cfgSite").value = cfg.udmSiteName || "";
  $("cfgUser").value = cfg.udmUsername || "";
  $("cfgPass").value = "";
  $("cfgPass").placeholder = cfg.hasPassword ? "leave blank to keep current password" : "enter a password";
  $("cfgSelfSigned").checked = !!cfg.allowSelfSigned;
  $("cfgModel").value = cfg.pduModel || "";
}

$("saveConfigBtn").onclick = async () => {
  $("configError").textContent = "";
  try {
    await api("/api/config", { method: "POST", body: JSON.stringify({
      udmHost: $("cfgHost").value,
      udmSiteName: $("cfgSite").value,
      udmUsername: $("cfgUser").value,
      udmPassword: $("cfgPass").value,
      allowSelfSigned: $("cfgSelfSigned").checked,
      pduModel: $("cfgModel").value,
    })});
    await loadConfigIntoForm();
    refreshPdus();
  } catch (err) { $("configError").textContent = err.message; }
};

$("changeAccountBtn").onclick = async () => {
  $("accountError").textContent = "";
  try {
    await api("/api/admin/password", { method: "POST", body: JSON.stringify({
      currentPassword: $("curPass").value,
      newUsername: $("newUser").value.trim(),
      newPassword: $("newPass").value,
    })});
    $("curPass").value = ""; $("newUser").value = ""; $("newPass").value = "";
    $("whoami").textContent = $("newUser").value || $("whoami").textContent;
    $("accountError").style.color = "var(--green)";
    $("accountError").textContent = "Updated.";
  } catch (err) { $("accountError").style.color = "var(--red)"; $("accountError").textContent = err.message; }
};

async function refreshPdus() {
  const statusEl = $("pduStatus");
  const listEl = $("pduList");
  try {
    const pdus = await api("/api/pdus");
    if (pdus.length === 0) {
      statusEl.textContent = "No PDUs found. Check Connection Settings, or confirm the PDU is adopted in UniFi.";
      listEl.innerHTML = "";
      return;
    }
    statusEl.textContent = pdus.length + " PDU(s) found.";
    for (const pdu of pdus) {
      let card = document.getElementById("pdu_" + pdu.id);
      if (!card) {
        card = document.createElement("div");
        card.className = "pdu-card";
        card.id = "pdu_" + pdu.id;
        card.innerHTML = '<h3></h3><div class="outlet-grid"></div>';
        listEl.appendChild(card);
      }
      card.querySelector("h3").textContent = pdu.name;
      const outlets = await api("/api/pdus/" + pdu.id + "/outlets");
      const grid = card.querySelector(".outlet-grid");
      grid.innerHTML = "";
      for (const o of outlets) {
        const isOn = o.relay_state === 1;

        const card = document.createElement("div");
        card.className = "outlet-card " + (isOn ? "on" : "off");

        const nameEl = document.createElement("div");
        nameEl.className = "outlet-name";
        nameEl.textContent = o.name;
        card.appendChild(nameEl);

        const powerEl = document.createElement("div");
        powerEl.className = "outlet-power";
        powerEl.textContent = o.power_watts !== null ? o.power_watts.toFixed(1) + " W" : " ";
        card.appendChild(powerEl);

        const actions = document.createElement("div");
        actions.className = "outlet-actions";

        const onBtn = document.createElement("button");
        onBtn.textContent = "On";
        onBtn.disabled = isOn;
        if (isOn) onBtn.classList.add("current-on");
        onBtn.onclick = () => setOutletPower(pdu.id, o.index, "on", actions);

        const offBtn = document.createElement("button");
        offBtn.textContent = "Off";
        offBtn.disabled = !isOn;
        if (!isOn) offBtn.classList.add("current-off");
        offBtn.onclick = () => setOutletPower(pdu.id, o.index, "off", actions);

        const rebootBtn = document.createElement("button");
        rebootBtn.textContent = "Reboot";
        rebootBtn.onclick = () => rebootOutlet(pdu.id, o.index, actions);

        actions.appendChild(onBtn);
        actions.appendChild(offBtn);
        actions.appendChild(rebootBtn);
        card.appendChild(actions);
        grid.appendChild(card);
      }
    }
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  }
}

async function setOutletPower(pduId, index, state, actionsEl) {
  const buttons = actionsEl.querySelectorAll("button");
  buttons.forEach((b) => { b.disabled = true; });
  try {
    await api("/api/pdus/" + pduId + "/outlet/" + index + "/power", {
      method: "POST", body: JSON.stringify({ state }),
    });
  } catch (err) {
    $("pduStatus").textContent = "Error: " + err.message;
  }
  refreshPdus();
}

async function rebootOutlet(pduId, index, actionsEl) {
  const buttons = actionsEl.querySelectorAll("button");
  buttons.forEach((b) => { b.disabled = true; });
  const rebootBtn = actionsEl.children[2];
  const original = rebootBtn.textContent;
  rebootBtn.textContent = "Rebooting...";
  try {
    await api("/api/pdus/" + pduId + "/outlet/" + index + "/cycle", { method: "POST" });
  } catch (err) {
    rebootBtn.textContent = "Error";
    $("pduStatus").textContent = "Error: " + err.message;
  }
  setTimeout(refreshPdus, 3000);
}

async function boot() {
  $("app").style.display = "none";
  $("gate").style.display = "flex";
  const session = await api("/api/session");
  if (session.setupNeeded) { showSetupForm(); return; }
  if (!session.loggedIn) { showLoginForm(); return; }
  showApp(session.username);
}

wirePasswordToggles(document);
boot();
</script>
</body>
</html>
